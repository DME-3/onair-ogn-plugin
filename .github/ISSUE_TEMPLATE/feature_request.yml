name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: Explain the need without disclosing private recording content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public references or alternatives
      description: Link protocol documentation or describe generated examples where useful.
