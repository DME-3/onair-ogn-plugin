name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check public source tree
        run: python3 tools/check_public_tree.py
      - name: Configure universal Release
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build --parallel 4
      - name: Run public protocol and SDK tests
        run: ctest --test-dir build --output-on-failure
      - name: Package and inspect architectures
        run: |
          python3 tools/package.py --build build
          lipo -info dist/ogn-mband/ogn-mband.dylib
      - name: Save package only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-universal-package
          path: |
            dist/*.onairplugin
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  ubsan:
    name: macOS UBSan
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure UBSan
        run: >-
          cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DOGN_SANITIZE=ON -DOGN_SANITIZERS=undefined
      - name: Build and test
        run: |
          cmake --build build-ubsan --parallel 4
          ctest --test-dir build-ubsan --output-on-failure
